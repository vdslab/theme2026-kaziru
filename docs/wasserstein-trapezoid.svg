<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef4fb"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: "Yu Gothic", "Noto Sans JP", sans-serif; fill: #172033; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 20px; font-weight: 700; }
      .body { font-size: 18px; }
      .small { font-size: 15px; }
      .conclusion { font-size: 22px; font-weight: 700; fill: #ffffff; }
      .axis { stroke: #334155; stroke-width: 2; }
      .grid { stroke: #cbd5e1; stroke-width: 1; stroke-dasharray: 5 6; }
    </style>
  </defs>

  <rect width="1200" height="820" rx="24" fill="url(#bg)"/>
  <text x="600" y="48" text-anchor="middle" class="title">ワッサースタイン距離を「面積」として見る</text>
  <text x="600" y="80" text-anchor="middle" class="body">同じ順位割合 q にある難易度の差を、0%から100%まで足し合わせます</text>

  <!-- Left panel: complete distributions -->
  <rect x="42" y="112" width="700" height="590" rx="18" fill="#ffffff" stroke="#d4deea" stroke-width="2"/>
  <text x="70" y="150" class="subtitle">① 2つの難易度分布を重ねる</text>

  <!-- Plot grid -->
  <line x1="115" y1="210" x2="115" y2="595" class="axis"/>
  <line x1="115" y1="595" x2="690" y2="595" class="axis"/>
  <line x1="115" y1="500" x2="690" y2="500" class="grid"/>
  <line x1="115" y1="405" x2="690" y2="405" class="grid"/>
  <line x1="115" y1="310" x2="690" y2="310" class="grid"/>
  <line x1="259" y1="210" x2="259" y2="595" class="grid"/>
  <line x1="403" y1="210" x2="403" y2="595" class="grid"/>
  <line x1="546" y1="210" x2="546" y2="595" class="grid"/>

  <!-- Area between quantile curves -->
  <path d="M115 515 C190 500,225 472,259 452 C310 423,360 393,403 365 C455 334,500 303,546 275 C600 243,650 220,690 206
           L690 298 C642 316,598 338,546 363 C500 386,452 413,403 438 C354 462,306 485,259 505 C210 527,163 544,115 554 Z"
        fill="#fb923c" opacity="0.28"/>

  <!-- Trapezoid slices -->
  <g stroke="#f97316" stroke-width="2" opacity="0.7">
    <line x1="115" y1="515" x2="115" y2="554"/>
    <line x1="172" y1="503" x2="172" y2="536"/>
    <line x1="230" y1="476" x2="230" y2="517"/>
    <line x1="287" y1="436" x2="287" y2="494"/>
    <line x1="345" y1="403" x2="345" y2="466"/>
    <line x1="403" y1="365" x2="403" y2="438"/>
    <line x1="460" y1="330" x2="460" y2="410"/>
    <line x1="518" y1="292" x2="518" y2="377"/>
    <line x1="575" y1="257" x2="575" y2="349"/>
    <line x1="633" y1="226" x2="633" y2="321"/>
    <line x1="690" y1="206" x2="690" y2="298"/>
  </g>

  <!-- Curves -->
  <path d="M115 515 C190 500,225 472,259 452 C310 423,360 393,403 365 C455 334,500 303,546 275 C600 243,650 220,690 206"
        fill="none" stroke="#2563eb" stroke-width="5"/>
  <path d="M115 554 C163 544,210 527,259 505 C306 485,354 462,403 438 C452 413,500 386,546 363 C598 338,642 316,690 298"
        fill="none" stroke="#16a34a" stroke-width="5"/>

  <text x="514" y="238" class="body" fill="#2563eb">Bの分位点 Q<tspan baseline-shift="sub" font-size="13">B</tspan>(q)</text>
  <text x="515" y="402" class="body" fill="#16a34a">Aの分位点 Q<tspan baseline-shift="sub" font-size="13">A</tspan>(q)</text>
  <text x="365" y="325" class="body" fill="#c2410c">オレンジ部分の面積が距離</text>

  <!-- Axis labels -->
  <text x="83" y="204" class="small">難しい</text>
  <text x="83" y="615" class="small">易しい</text>
  <text x="115" y="626" text-anchor="middle" class="small">0%</text>
  <text x="403" y="626" text-anchor="middle" class="small">50%</text>
  <text x="690" y="626" text-anchor="middle" class="small">100%</text>
  <text x="403" y="660" text-anchor="middle" class="body">易しい順に見た位置 q</text>

  <!-- Right panel: one trapezoid -->
  <rect x="770" y="112" width="388" height="590" rx="18" fill="#ffffff" stroke="#d4deea" stroke-width="2"/>
  <text x="798" y="150" class="subtitle">② 細い台形に分ける</text>
  <text x="798" y="181" class="small">そのうち1個を拡大すると…</text>

  <line x1="825" y1="480" x2="1112" y2="480" class="axis"/>
  <line x1="860" y1="235" x2="860" y2="480" class="grid"/>
  <line x1="1065" y1="235" x2="1065" y2="480" class="grid"/>

  <!-- Enlarged trapezoid -->
  <path d="M860 284 L1065 250 L1065 398 L860 385 Z" fill="#fb923c" opacity="0.38" stroke="#f97316" stroke-width="3"/>
  <line x1="860" y1="284" x2="1065" y2="250" stroke="#2563eb" stroke-width="5"/>
  <line x1="860" y1="385" x2="1065" y2="398" stroke="#16a34a" stroke-width="5"/>
  <line x1="860" y1="284" x2="860" y2="385" stroke="#c2410c" stroke-width="3"/>
  <line x1="1065" y1="250" x2="1065" y2="398" stroke="#c2410c" stroke-width="3"/>

  <text x="815" y="337" text-anchor="end" class="small" fill="#c2410c">差 k</text>
  <text x="1078" y="333" class="small" fill="#c2410c">差 k+1</text>
  <line x1="860" y1="445" x2="1065" y2="445" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="962" y="438" text-anchor="middle" class="small">幅 Δq</text>

  <rect x="802" y="520" width="322" height="106" rx="12" fill="#fff7ed" stroke="#fdba74"/>
  <text x="963" y="550" text-anchor="middle" class="body">台形1個の面積</text>
  <text x="963" y="584" text-anchor="middle" class="body">＝ (左の差 ＋ 右の差) ÷ 2 × 幅</text>
  <text x="963" y="610" text-anchor="middle" class="small">幅 Δq は、この実装では 1/1000</text>

  <!-- Bottom conclusion -->
  <path d="M600 705 L600 738" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="175" y="742" width="850" height="58" rx="16" fill="#172033"/>
  <text x="600" y="779" text-anchor="middle" class="conclusion">1000個の台形の面積を全部足す ≒ ワッサースタイン距離</text>
</svg>
